interface:
  display_name: "事故报告生成"
  short_description: "按 DAS 故障模板收集信息并生成可下载的 incident report 文档"
  default_prompt: "请使用 $incident-report。若用户未明确给出完整事故信息，必须按 6 个必填章节分步骤提问并收集上下文，每次只推进当前缺失步骤；在信息不足时不要直接生成文档。仅当 6 个章节信息已齐全（或用户明确同意缺失项使用 N/A/空数组）后，再调用工具生成附件。report_data 请尽量严格对齐 examples/incident_data.json 的字段结构，不要省略关键字段。若用户明确同意缺省项，设置 report_data.allow_incomplete=true 后再调用生成工具。优先调用 skill 工具，而不是让用户手动运行脚本。生成附件后只需告知已生成并引导用户在附件区下载，不要输出 file://、/tmp 等本地路径。"
