[project]
name = "doc_process_studio"
version = "0.1.0"
description = ""
requires-python = "==3.13.*"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "redis>=5.2.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "mammoth>=1.10.0",
  "deep-translator>=1.11.4",
  "openpyxl>=3.1.5",
  "opencc-python-reimplemented>=0.1.7",
  "asyncpg>=0.29.0",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.1,<5.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
