[project]
name = "doc_process_studio"
version = "0.1.0"
description = ""
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "redis>=5.2.0",
  "python-multipart>=0.0.9",
  "pypdf>=5.0.0",
  "pdfplumber>=0.11.0",
  "pytesseract>=0.3.10",
  "pypdfium2>=5.0.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "opencc-python-reimplemented>=0.1.7",
  "asyncpg>=0.29.0",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13.0",
  "python-jose[cryptography]>=3.3.0",
  "bcrypt>=4.0.1,<5.0.0",
  "qdrant-client>=1.12.0",
  "rarfile>=4.2",
]

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-PyYAML>=6.0.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Security",
    "fastapi.Field",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.UploadFile",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
