# frontend/nginx.conf
# 同时托管 SPA 静态资源，并把 /api 反向代理到后端容器。
# 生产请补 listen 443 + ssl_certificate + 强制 HTTPS + 安全响应头。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退：未知路径交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理到后端（compose 中服务名 app:8000）
    # 注意：proxy_pass 末尾不要带 "/"，否则 nginx 会把 /api 前缀整体剥掉，
    # 导致后端实际收到 /auth/login 而路由是 /api/auth/login → 404。
    # 这里保留完整原始 URI（含 /api），与后端路由前缀保持一致。
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;   # 对齐后端 request_timeout_seconds
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 可选：给静态资源加缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
