services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=copy
      - LOCAL_WORKSPACE_FOLDER=/workspace
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - UV_DEFAULT_INDEX_URL=https://mirrors.aliyun.com/pypi/simple
      - PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright
    volumes:
      - /var/run/docker.sock:/var/run/docker-host.sock
      - ..:/workspace:delegated
      - ~/.codex:/home/vscode/.codex
      - ~/.trae-cn:/home/vscode/.trae-cn
      - ~/.trae-cn-server:/home/vscode/.trae-cn-server
      - ~/.config/kilo:/home/vscode/.config/kilo
      - ~/.local/share/kilo:/home/vscode/.local/share/kilo
    ports:
      - "5173:5173"
      - "8000:8000"
      - "9323:9323"
      - "2222:22"
    command: bash -lc '/workspace/.devcontainer/startup.sh'
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: admin
      # 密码来自 .devcontainer/.env（由 scripts/ensure_env.py --env dev 生成）；
      # compose 在项目目录自动读取该文件做插值。缺失即报错，防止空密码初始化数据卷。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺少 POSTGRES_PASSWORD —— 先在仓库根目录运行 python3 scripts/ensure_env.py --env dev}
      POSTGRES_DB: master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d master" ]
      interval: 20s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:?缺少 REDIS_PASSWORD —— 先在仓库根目录运行 python3 scripts/ensure_env.py --env dev} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:
