services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=copy
      - LOCAL_WORKSPACE_FOLDER=/workspace
      - NPM_CONFIG_REGISTRY=https://registry.npmmirror.com
      - PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright
    volumes:
      - /var/run/docker.sock:/var/run/docker-host.sock
      - ..:/workspace:delegated
      - ~/.codex:/home/vscode/.codex
      - ~/.trae-cn:/home/vscode/.trae-cn
      - ~/.trae-cn-server:/home/vscode/.trae-cn-server
      - ~/.config/kilo:/home/vscode/.config/kilo
      - ~/.local/share/kilo:/home/vscode/.local/share/kilo
    ports:
      - "5173:5173"
      - "8000:8000"
      - "9323:9323"
      - "2222:22"
    command: bash -lc '/workspace/.devcontainer/startup.sh'
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d master" ]
      interval: 20s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_dev_password --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis_dev_password", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e 'GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3" ]
      interval: 1s
      timeout: 30s
      start_period: 60s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
