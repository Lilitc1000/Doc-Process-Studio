services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PYTHONUNBUFFERED=1
      - LOCAL_WORKSPACE_FOLDER=/workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker-host.sock
      - ..:/workspace:delegated
      - ~/.codex:/home/vscode/.codex
    ports:
      - "5173:5173"
      - "8000:8000"
      - "9323:9323"
      - "2222:22"
    command: bash -lc '/workspace/.devcontainer/startup.sh'
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: master
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d master" ]
      interval: 20s
      timeout: 5s
      retries: 5
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis_dev_password --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis_dev_password", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
  redis_data:
