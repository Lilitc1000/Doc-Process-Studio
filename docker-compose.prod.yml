# docker-compose.prod.yml  (生产环境)
# 与开发环境（.devcontainer/docker-compose.devcontainer.yml）完全独立：本文件面向生产，
# 密钥全部走插值变量（${VAR}），来源是部署机上的 .env（务必放在 rsync 同步目录之外，
# 如 /opt/dps/.env，并用 `docker compose --env-file /opt/dps/.env` 读取；切勿放在仓库根目录
# 让 rsync 覆盖进来——下一次部署的 rsync --delete 会把它删掉）。
#
# 部署机准备（一次性）：
#   1) 在仓库根目录执行：python3 scripts/ensure_env.py --env prod --path /opt/dps/.env
#      —— 文件不存在则自动生成 4 个基础设施密钥（POSTGRES/REDIS/JWT/ENCRYPTION），
#      已存在则只补缺、绝不覆盖（根 .gitignore 已忽略 /.env，不会入库）；
#   2) 备份 /opt/dps/.env（它是唯一真相源：删除后重新生成会导致密码与既有数据卷错位）；
#   3) 部署作业用 `docker compose --env-file /opt/dps/.env -f docker-compose.prod.yml ...` 读取该文件；
#      也可以把根目录 .gitlab-ci.example.yml 复制为 .gitlab-ci.yml 走流水线部署（见模板内说明）。
#
# 上线步骤：
#   docker compose -f docker-compose.prod.yml run --rm app alembic upgrade head   # 建表/迁移
#   docker compose -f docker-compose.prod.yml up -d --build
#   # 首次启动后，部署者在 /setup 页创建管理员，再在「系统设置 → 系统密钥」页填入 RAGFlow API Key。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-master}
    volumes:
      - dps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-master}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 修复旧 docker-compose.cd.yml 的 bug：必须挂卷，否则重启丢数据
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - dps_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ENV=prod：缺失 SETTINGS_ENCRYPTION_KEY 会在启动期 fail-fast（设计如此）
    environment:
      ENV: prod
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://59.152.224.254:8081}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-doc-process-studio}
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-43200}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-master}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
    # 附件持久化：容器内默认路径为 /app/generated-attachments，必须挂卷否则容器重启丢文件
    volumes:
      - dps_attachments:/app/generated-attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dps_pgdata:
  dps_redis:
  dps_attachments:
