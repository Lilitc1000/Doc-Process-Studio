# docker-compose.prod.yml  (生产环境)
# 与 docker-compose.yml（开发部署版）完全独立：本文件面向生产，密钥全部走
# 插值变量（${VAR}），来源是部署机上的 .env（建议放在 rsync 同步目录之外，如 /opt/dps/.env，并用 `docker compose --env-file /opt/dps/.env` 读取；切勿放在仓库根目录让 rsync 覆盖进来——下一次部署的 rsync --delete 会把它删掉），也可来自 GitLab CI/CD 变量。
# 不把任何密钥写进本文件；仓库已不再提交 .env.prod（其含真实生产凭据，已移除），生产密钥全部来自部署机 .env / CI/CD 变量。
#
# 部署机准备（一次性）：
#   1) 复制模板并放到 rsync 目录【之外】：cp .env.prod.example /opt/dps/.env
#      然后将下方所有 <...> 占位符替换为真实值（根 .gitignore 已忽略 .env，不会入库）；
#   2) 生成主密钥：python -c "import base64,os;print(base64.b64encode(os.urandom(32)).decode())"
#      放入 SETTINGS_ENCRYPTION_KEY；
#   3) 部署作业用 `docker compose --env-file /opt/dps/.env -f docker-compose.prod.yml ...` 读取该文件。
#
# 上线步骤：
#   docker compose -f docker-compose.prod.yml run --rm app alembic upgrade head   # 建表/迁移
#   docker compose -f docker-compose.prod.yml up -d --build
#   # 首次启动后，管理员需在「系统设置 → 系统密钥」页填入 RAGFlow API Key（通用密钥库，见 config.py 注释）。

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-master}
    volumes:
      - dps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-master}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 修复旧 docker-compose.cd.yml 的 bug：必须挂卷，否则重启丢数据
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - dps_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # ENV=prod：缺失 SETTINGS_ENCRYPTION_KEY 会在启动期 fail-fast（设计如此）
    environment:
      ENV: prod
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://59.152.224.254:8081}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-doc-process-studio}
      REDIS_TTL_SECONDS: ${REDIS_TTL_SECONDS:-43200}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-master}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      RAGFLOW_ENABLED: ${RAGFLOW_ENABLED:-true}
      RAGFLOW_BASE_URL: ${RAGFLOW_BASE_URL:-http://s.gdautotoll.com.cn:10108}
      RAGFLOW_SIMILARITY_THRESHOLD: ${RAGFLOW_SIMILARITY_THRESHOLD:-0.55}
      RAGFLOW_TOP_K: ${RAGFLOW_TOP_K:-3}
      RAGFLOW_PARSE_TIMEOUT_SECONDS: ${RAGFLOW_PARSE_TIMEOUT_SECONDS:-60}
    # 附件持久化：容器内默认路径为 /app/generated-attachments，必须挂卷否则容器重启丢文件
    volumes:
      - dps_attachments:/app/generated-attachments
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  dps_pgdata:
  dps_redis:
  dps_attachments:
